name: Build My Creative Notes Android Test APK
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-test.yml'
      - 'android/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-test-build
  cancel-in-progress: false
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website and Android app
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 platform using runner SDK
        run: |
          echo "Using Android SDK at ${ANDROID_HOME}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and sign test APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Creative-Notes-Android-v11-TEST2
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Android TEST2 APK to website
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/My-Creative-Notes-Android-v11-TEST2.apk
          git config user.name "BroKaz Android Builder"
          git config user.email "brokaz-android-builder@users.noreply.github.com"
          git add downloads/My-Creative-Notes-Android-v11-TEST2.apk
          git diff --cached --quiet && exit 0
          git commit -m "Publish Android v11 TEST APK [skip ci]"
          git push origin HEAD:main
